x-temporal-database: &temporal-database
  DB: postgres12
  DB_PORT: "5432"
  DBNAME: ${TEMPORAL_POSTGRES_DB:-temporal}
  VISIBILITY_DBNAME: ${TEMPORAL_VISIBILITY_DB:-temporal_visibility}
  POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
  POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
  POSTGRES_SEEDS: temporal-postgresql

x-temporal-admin-image: &temporal-admin-image temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754

services:
  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
      VISIBILITY_DBNAME: ${TEMPORAL_VISIBILITY_DB:-temporal_visibility}
    ports:
      - "127.0.0.1:${TEMPORAL_DB_PORT:-5435}:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
      - ./init-temporal-db.sh:/docker-entrypoint-initdb.d/init-temporal-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 20

  temporal-schema:
    image: *temporal-admin-image
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment: *temporal-database
    entrypoint: ["/bin/sh", "/opt/whatsap/setup-temporal-schema.sh"]
    volumes:
      - ./setup-temporal-schema.sh:/opt/whatsap/setup-temporal-schema.sh:ro

  temporal:
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      <<: *temporal-database
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ALLOW_NO_AUTH: "true"
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/whatsap.yaml
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/whatsap.yaml:ro

  temporal-namespace:
    image: *temporal-admin-image
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_NAMESPACE_RETENTION: ${TEMPORAL_NAMESPACE_RETENTION:-3d}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        remaining=30
        until temporal operator cluster health --command-timeout 3s >/dev/null 2>&1; do
          remaining=$$((remaining - 1))
          if [ "$$remaining" -eq 0 ]; then
            echo "Temporal did not become ready" >&2
            exit 1
          fi
          sleep 2
        done
        if ! temporal operator namespace describe --namespace "$${TEMPORAL_NAMESPACE}"; then
          temporal operator namespace create --namespace "$${TEMPORAL_NAMESPACE}" --retention "$${TEMPORAL_NAMESPACE_RETENTION}"
        fi

  temporal-ui:
    image: temporalio/ui:2.56.1@sha256:584dd3408ab8333888d50b12d4a683e550e963409bf95fa2c9159d40d7cb825f
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"

volumes:
  temporal-postgres-data:
    name: temporal-postgres-data
