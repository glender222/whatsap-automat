name: CI

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'test/**'
      - 'infra/**'
      - 'audit/**'
  pull_request:
    branches:
      - main
      - 'integration/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            packages/contracts/package-lock.json
            WhatsaapWeb-JS/package-lock.json

      - name: Compilar contratos compartidos
        working-directory: packages/contracts
        run: |
          npm ci
          npm run build

      - name: Instalar dependencias
        working-directory: WhatsaapWeb-JS
        run: npm ci

      - name: Validación de tipos estáticos (typecheck)
        working-directory: WhatsaapWeb-JS
        run: npm run typecheck

      - name: Validación de tipos de scripts
        working-directory: WhatsaapWeb-JS
        run: npm run typecheck:scripts

      - name: Compilación TypeScript (build)
        working-directory: WhatsaapWeb-JS
        run: npm run build

      - name: Ejecución de suite de pruebas P0 y mitigaciones de seguridad (bloqueante)
        working-directory: WhatsaapWeb-JS
        run: npm test

      - name: Autorización de herramientas, aprobaciones y marketplace
        working-directory: WhatsaapWeb-JS
        run: node --import tsx --test src/test/ai-tool-routes.test.ts src/test/publication-gate.test.ts src/test/tool-broker.test.ts src/test/rag-knowledge-base.test.ts src/test/m3-rag-adversarial-challenge.test.ts src/test/marketplace-registry.test.ts src/test/workflows-ingress-rollback.test.ts

  product-smoke:
    name: Flujo de producto con PostgreSQL y Socket.IO
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: WhatsaapWeb-JS
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: whatsap_automat_smoke
      DB_USER: whatsap_smoke
      DB_PASSWORD: ci-runtime-only
      JWT_SECRET: ci-smoke-jwt-secret-at-least-32-characters
      WHATSAPP_PROVIDER: meta-cloud
      META_GRAPH_VERSION: v25.0
      META_WA_PHONE_NUMBER_ID: '100000000000001'
      META_WABA_ID: '100000000000002'
      META_WEBHOOK_VERIFY_TOKEN: ci-meta-verify-token-only
      META_WA_ACCESS_TOKEN: synthetic-local-token
      META_APP_SECRET: ci-meta-signing-secret-only
      PORT: 3024
      PRODUCT_SMOKE_URL: http://127.0.0.1:3024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            WhatsaapWeb-JS/package-lock.json
      - name: Instalar contratos y backend
        run: |
          npm --prefix ../packages/contracts ci
          npm --prefix ../packages/contracts run build
          npm ci
          npm run build
      - name: Crear base vacía y aplicar migraciones con RLS
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h "$DB_HOST" -U postgres <<'SQL'
          CREATE ROLE whatsap_smoke LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-runtime-only';
          CREATE DATABASE whatsap_automat_smoke OWNER whatsap_smoke;
          SQL
          npm run db:migrate
      - name: Probar sesión, webhook firmado, bandeja, Socket.IO, takeover y aprobaciones
        run: |
          node dist/index.js > "$RUNNER_TEMP/product-smoke.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$PRODUCT_SMOKE_URL/health" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS "$PRODUCT_SMOKE_URL/health" || ! node --import tsx --test src/test/product-smoke.integration.test.ts; then
            cat "$RUNNER_TEMP/product-smoke.log"
            exit 1
          fi
      - name: Probar campañas y marketplace contra PostgreSQL
        env:
          CAMPAIGN_SMOKE: '1'
          MARKETPLACE_TEST_DATABASE_URL: postgres://whatsap_smoke:ci-runtime-only@127.0.0.1:5432/whatsap_automat_smoke
        run: node --import tsx --test src/test/campaign-persistence.integration.test.ts src/test/marketplace-postgres.test.ts

  contracts-ci:
    name: Shared Contracts CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/contracts/package-lock.json

      - name: Instalar dependencias
        working-directory: packages/contracts
        run: npm ci

      - name: Validación de tipos estáticos (typecheck)
        working-directory: packages/contracts
        run: npm run typecheck

      - name: Pruebas unitarias de contratos, canales y mappers (bloqueante)
        working-directory: packages/contracts
        run: npm test

      - name: Compilación de contratos (build)
        working-directory: packages/contracts
        run: npm run build

  temporal-spike-ci:
    name: Temporal Spike CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: spikes/temporal/package-lock.json

      - name: Instalar dependencias
        working-directory: spikes/temporal
        run: npm ci

      - name: Validación de tipos estáticos (typecheck)
        working-directory: spikes/temporal
        run: npm run typecheck

      - name: Pruebas de durabilidad, temporizadores y reintentos (bloqueante)
        working-directory: spikes/temporal
        run: npm test

  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: Frontend_py_whatsaapweb/package-lock.json

      - name: Instalar dependencias
        working-directory: Frontend_py_whatsaapweb
        run: npm ci

      - name: Compilación y empaquetado Vite (build)
        working-directory: Frontend_py_whatsaapweb
        run: npm run build

      - name: Análisis estático ESLint (Reporte de baseline)
        working-directory: Frontend_py_whatsaapweb
        run: npm run lint
        continue-on-error: true # Deuda técnica documentada en PR-00: 255 problemas de tipado legacy

  repo-hygiene:
    name: Higiene del Repositorio y Licencia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar presencia de LICENSE MIT
        run: |
          test -f LICENSE || (echo "ERROR: Archivo LICENSE ausente" && exit 1)
          grep -q "MIT License" LICENSE || (echo "ERROR: LICENSE no es MIT" && exit 1)

      - name: Verificar que no existan archivos de secretos versionados
        run: |
          # Asegurar que ningun archivo .env que no sea .env.example este en git
          FOUND_ENV=$(git ls-files | grep -E "(^|/)\.env(\..+)?$" | grep -v "\.env\.example$" || true)
          if [ -n "$FOUND_ENV" ]; then
            echo "ERROR: Se encontraron archivos de entorno potencialmente sensibles versionados:"
            echo "$FOUND_ENV"
            exit 1
          fi

  client-packages:
    name: SDK TypeScript, CLI y aplicación móvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/sdk/package-lock.json
            packages/cli/package-lock.json
            apps/mobile/package-lock.json
      - name: Compilar contratos, SDK y CLI
        run: |
          npm --prefix packages/contracts ci
          npm --prefix packages/contracts run build
          npm --prefix packages/sdk ci
          npm --prefix packages/sdk run build
          npm --prefix packages/sdk test
          npm --prefix packages/cli ci
          npm --prefix packages/cli run build
          npm --prefix packages/cli test
      - name: Validar aplicación móvil
        run: |
          npm --prefix apps/mobile ci
          npm --prefix apps/mobile run typecheck
          npm --prefix apps/mobile test

  python-and-docs:
    name: SDK Python y descargas de documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar SDK Python
        working-directory: packages/python-sdk
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest
      - name: Generar portal y comprobar ZIP
        run: |
          python docs-site/build.py
          python -m zipfile -t docs-site/dist/downloads/whatsap-automat-docs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: whatsap-automat-docs-site
          path: docs-site/dist
          if-no-files-found: error
          echo "OK: No hay archivos .env sensibles versionados."
