# Demo de Temporal OSS y worker opcional. Requiere Docker Compose 2.20 o posterior.
include:
  - path:
      - ./deploy/temporal/docker-compose.yml
      - ./deploy/temporal/compose.demo.override.yaml

services:
  temporal-spike-worker:
    build:
      context: ./spikes/temporal
      dockerfile: Dockerfile
    profiles:
      - worker
      - full
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-spike-task-queue}
